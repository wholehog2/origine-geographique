
name: Compiler Geo-GEDCOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Compilation Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy pillow plotly==5.24.1

      - name: Compiler le programme
        run: |
          pyinstaller --noconfirm --clean --windowed --collect-data plotly --exclude-module kaleido --name GeoGEDCOM geo-gedcom.py

      - name: Publier le programme Windows
        uses: actions/upload-artifact@v7
        with:
          name: GeoGEDCOM-Windows
          path: dist/GeoGEDCOM
          if-no-files-found: error

  build-macos:
    name: Compilation macOS
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy pillow plotly==5.24.1

      - name: Compiler le programme
        run: |
          pyinstaller --noconfirm --clean --windowed --collect-data plotly --exclude-module kaleido --name GeoGEDCOM geo-gedcom.py

      - name: Créer l'archive macOS
        run: |
          cd dist
          zip -r GeoGEDCOM-macOS.zip GeoGEDCOM.app

      - name: Publier le programme macOS
        uses: actions/upload-artifact@v7
        with:
          name: GeoGEDCOM-macOS
          path: dist/GeoGEDCOM-macOS.zip
          if-no-files-found: error
